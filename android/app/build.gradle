plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.luma.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.luma.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = '3.11'
        pip { install '-r', rootProject.file('../requirements-android.txt').absolutePath }
    }
}
tasks.register('syncOfficeCore', Copy) {
    from '../../csv-pdf.py'
    into 'src/main/python'
    rename { 'office_core.py' }
}
tasks.configureEach { task ->
    if (task.name.startsWith('generate') && task.name.endsWith('PythonAssets')) {
        task.dependsOn tasks.named('syncOfficeCore')
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
