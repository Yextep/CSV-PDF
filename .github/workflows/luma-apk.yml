name: Compilar y probar Luma
on:
  workflow_dispatch:
  push:
    branches: [main, 'app/**']
    paths: ['android/**', 'csv-pdf.py', 'requirements-android.txt', 'tests/**', 'scripts/**', '.github/workflows/luma-apk.yml']
permissions:
  contents: read
concurrency:
  group: luma-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Probar conversiones y diseño móvil
        run: |
          python -m pip install -r requirements-android.txt pytest playwright
          python -m playwright install --with-deps chromium
          python -m pytest -q
          python scripts/browser_smoke.py
      - name: Compilar APK y pruebas
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest lintRelease
      - name: Preparar emulador
        run: sudo chmod 666 /dev/kvm
      - name: Probar Luma en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_smoke.sh
      - name: Firmar APK instalable
        env:
          LUMA_SIGNING_KEYSTORE: ${{ secrets.LUMA_SIGNING_KEYSTORE }}
          LUMA_SIGNING_PASSWORD: ${{ secrets.LUMA_SIGNING_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'luma.p12'
          key.write_bytes(base64.b64decode(os.environ['LUMA_SIGNING_KEYSTORE']))
          key.chmod(0o600)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/luma.p12" --ks-key-alias luma \
            --ks-pass env:LUMA_SIGNING_PASSWORD --key-pass env:LUMA_SIGNING_PASSWORD \
            --out android/app/build/outputs/apk/release/Luma.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/Luma.apk
          rm "$RUNNER_TEMP/luma.p12"
          cd android/app/build/outputs/apk/release
          sha256sum Luma.apk > Luma.apk.sha256
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-APK
          path: |
            android/app/build/outputs/apk/release/Luma.apk
            android/app/build/outputs/apk/release/Luma.apk.sha256
          if-no-files-found: error
      - name: Guardar verificaciones y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Luma-verificacion
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            docs/luma-*.png
            docs/luma-android-logcat.txt
          if-no-files-found: ignore
